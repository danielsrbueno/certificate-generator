<div class="text-center">
  <h1 class="font-bold text-3xl mb-2">Certificados gerados</h1>
  <p class="text-gray-500 mb-10">Visualize todos os certificados gerados</p>
</div>
@if (certificates.length === 0) {
  <div class="flex flex-col gap-5 items-center justify-between p-10 mb-2 border border-gray-200 rounded-lg">
    <i class="ph ph-certificate text-7xl text-gray-500"></i>
    <div class="text-center">
      <h1 class="text-lg font-semibold text-blue-950">Nenhum certificado gerado</h1>
      <p class="text-sm text-gray-500">Gere certificados para consultar o histórico</p>
    </div>
    <app-secondary-button routerLink="/certificates/new" buttonText="Gerar certificado"></app-secondary-button>
  </div>
}
@else {
  <div class="flex flex-col">
    @for(certificate of certificates; track $index) {
      <app-item-certificate [createdAt]="this.certificates[$index].createdAt" [studentName]="this.certificates[$index].studentName" [id]="this.certificates[$index].id"></app-item-certificate>
    }
  </div>
}
